name: certichain

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-certichain}
      POSTGRES_USER: ${POSTGRES_USER:-certichain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-certichain}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-certichain} -d ${POSTGRES_DB:-certichain}"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r3
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-certichain}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-certichainsecret}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET:-certichain}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  minio_data:
