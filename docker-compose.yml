name: certichain

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-certichain}
      POSTGRES_USER: ${POSTGRES_USER:-certichain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-certichain}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-certichain} -d ${POSTGRES_DB:-certichain}"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-certichain}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-certichainsecret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-certichain}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-certichainsecret}
      MINIO_BUCKET: ${MINIO_BUCKET:-certichain}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET
      "
    restart: "no"

volumes:
  postgres_data:
  minio_data:
